<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signing in…</title>
  <style>
    body { margin: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <p>Completing sign-in…</p>
  <script>
    /**
     * MSAL v5 popup redirect page.
     *
     * MSAL v5 uses a BroadcastChannel keyed on the libraryState.id to pass the
     * auth-code response from the popup back to the parent window.  This page:
     *  1. Reads the current URL (hash or search) which contains the auth code.
     *  2. Parses the `state` parameter to extract the libraryState.id.
     *  3. Opens a BroadcastChannel on that id and posts the response payload
     *     in the exact format MSAL expects.
     *  4. Closes the popup.
     *
     * This avoids loading the full React/MSAL bundle here.
     */
    (function () {
      try {
        // The auth response can be in the hash OR the search string
        var responseString = window.location.hash || window.location.search;
        if (!responseString || responseString.length < 2) {
          // Nothing to process — just close
          window.close();
          return;
        }

        // Strip leading # or ?
        var paramString = responseString.slice(1);
        var params = {};
        paramString.split('&').forEach(function (pair) {
          var idx = pair.indexOf('=');
          if (idx > -1) {
            params[decodeURIComponent(pair.slice(0, idx))] = decodeURIComponent(pair.slice(idx + 1).replace(/\+/g, ' '));
          }
        });

        // The `state` param is base64url-encoded JSON: { id, meta, ... }
        var stateParam = params['state'];
        if (!stateParam) {
          window.close();
          return;
        }

        // Extract the libraryState.id — MSAL encodes state as: <requestId>.<b64LibraryState>
        // Split on the first dot
        var dotIdx = stateParam.indexOf('.');
        var b64LibraryState = dotIdx > -1 ? stateParam.slice(dotIdx + 1) : stateParam;

        // base64url → base64 → JSON
        var b64 = b64LibraryState.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4 !== 0) b64 += '=';
        var libraryState = JSON.parse(atob(b64));
        var channelId = libraryState.id;

        if (!channelId) {
          window.close();
          return;
        }

        // Post the response to the BroadcastChannel MSAL is listening on
        var channel = new BroadcastChannel(channelId);
        channel.postMessage({ payload: responseString, v: 1 });
        channel.close();

        // Give MSAL a moment to receive the message, then close the popup
        setTimeout(function () { window.close(); }, 500);
      } catch (e) {
        // If anything fails, just close the popup — MSAL will timeout cleanly
        console.warn('[auth-redirect] Error processing popup response:', e.message);
        window.close();
      }
    })();
  </script>
</body>
</html>
