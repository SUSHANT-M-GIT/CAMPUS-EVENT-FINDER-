<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signing in…</title>
  <style>
    body { margin: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <p>Completing sign-in…</p>
  <script>
    /**
     * MSAL v5 popup redirect page.
     *
     * MSAL v5 state format:  <base64LibraryState>|<userState>
     *   libraryState = base64( JSON { id: guid, meta?: {...} } )
     *   RESOURCE_DELIM = "|"
     *
     * MSAL waits on:  new BroadcastChannel(libraryState.id)
     * Message format: { payload: <full response string>, v: 1 }
     *
     * This page:
     *  1. Reads the auth response from the URL (hash or search).
     *  2. Parses the `state` param → base64-decodes → gets libraryState.id
     *  3. Posts the response to that BroadcastChannel.
     *  4. Closes the popup.
     */
    (function () {
      try {
        // Auth response is in the hash (implicit/hybrid) or search (code flow)
        var responseString = window.location.hash || window.location.search;
        if (!responseString || responseString.length < 2) {
          window.close();
          return;
        }

        // Parse all key=value pairs from the response
        var paramString = responseString.slice(1); // strip leading # or ?
        var params = {};
        paramString.split('&').forEach(function (pair) {
          var idx = pair.indexOf('=');
          if (idx > -1) {
            try {
              params[decodeURIComponent(pair.slice(0, idx))] =
                decodeURIComponent(pair.slice(idx + 1).replace(/\+/g, ' '));
            } catch (e) { /* ignore malformed pairs */ }
          }
        });

        var stateParam = params['state'];
        if (!stateParam) {
          window.close();
          return;
        }

        // MSAL state format: "<base64LibraryState>|<userState>"
        // RESOURCE_DELIM = "|"
        var b64LibraryState = stateParam.split('|')[0];
        if (!b64LibraryState) {
          window.close();
          return;
        }

        // base64 decode (handle base64url encoding too)
        var b64 = b64LibraryState.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4 !== 0) { b64 += '='; }
        var libraryState = JSON.parse(atob(b64));
        var channelId = libraryState && libraryState.id;

        if (!channelId) {
          window.close();
          return;
        }

        // Post auth response to the BroadcastChannel MSAL is listening on
        var channel = new BroadcastChannel(channelId);
        // MSAL v5 waitForBridgeResponse expects: { payload: responseString, v: 1 }
        channel.postMessage({ payload: responseString, v: 1 });
        channel.close();

        // Close the popup after a short delay so MSAL receives the message
        setTimeout(function () { window.close(); }, 300);

      } catch (e) {
        console.warn('[auth-redirect] Error:', e.message);
        // On any failure close the popup — MSAL will surface a timeout error
        window.close();
      }
    })();
  </script>
</body>
</html>
